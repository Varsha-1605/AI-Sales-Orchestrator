<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Widget - Van Heusen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Page: web chat */
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .bar-wide { padding: 0 var(--gutter); }

        .language-selector {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            color: var(--ink-soft);
        }

        .language-selector select {
            min-height: 40px;
            padding: 0 var(--space-3);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--white);
            color: var(--ink);
            font-family: var(--font-text);
            font-size: var(--text-sm);
            font-weight: 500;
            cursor: pointer;
        }
        .language-selector select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .chat-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 300px 1fr;
            min-height: 0;
        }

        /* Sidebar: conversation history */
        .sidebar {
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--white);
            border-right: 1px solid var(--line);
        }

        .sidebar-header {
            padding: var(--space-5);
            border-bottom: 1px solid var(--line);
        }
        .sidebar-header h3 { margin-bottom: var(--space-4); }

        .new-chat-btn { width: 100%; }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-2) 0;
        }

        .conversation-item {
            padding: var(--space-3) var(--space-5);
            border-left: 3px solid transparent;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
            transition: background-color 120ms ease;
        }
        .conversation-item:hover { background: var(--ivory); }
        .conversation-item.active { background: var(--stone); border-left-color: var(--ink); }

        .conversation-title {
            font-size: var(--text-sm);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conversation-date {
            margin-top: 2px;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.04em;
            color: var(--ink-soft);
        }

        /* Main column */
        .chat-container {
            display: flex;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
            background: var(--ivory);
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            padding: var(--space-4) var(--space-6);
            background: var(--white);
            border-bottom: 1px solid var(--line);
        }

        .avatar {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border: 1px solid var(--ink);
            background: var(--ink);
            color: var(--white);
        }

        .header-info h2 { font-size: 22px; font-weight: 500; }

        .status {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-top: 2px;
            font-size: var(--text-xs);
            color: var(--ink-soft);
        }

        .chat-messages {
            flex: 1 1 auto;
            min-height: 0;
            padding: var(--space-6) max(var(--gutter), calc((100% - 820px) / 2));
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--line) transparent;
        }

        .message { margin-bottom: var(--space-5); animation: message-in 160ms ease; }
        @keyframes message-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .message.bot { text-align: left; }
        .message.user { text-align: right; }

        .message-bubble {
            display: inline-block;
            max-width: min(75%, 640px);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius);
            word-wrap: break-word;
            text-align: left;
            line-height: 1.55;
        }

        .bot .message-bubble {
            background: var(--white);
            color: var(--ink);
            border: 1px solid var(--line);
            white-space: pre-line;
        }
        .bot .message-bubble strong,
        .bot .message-bubble b { font-weight: 600; }
        .bot .message-bubble em,
        .bot .message-bubble i { font-family: var(--font-display); font-size: 1.05em; }

        .user .message-bubble {
            background: var(--ink);
            color: var(--white);
            border: 1px solid var(--ink);
        }

        .message-time {
            display: block;
            margin-top: var(--space-2);
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.04em;
            color: var(--ink-soft);
        }
        .user .message-time { color: #B8C0C6; }

        .typing-indicator {
            display: inline-flex;
            gap: 5px;
            padding: var(--space-4);
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }
        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: var(--ink-soft);
            animation: typing 1.2s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { opacity: 0.25; }
            30% { opacity: 1; }
        }

        /* Quick replies and product action buttons */
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
            margin: var(--space-3) 0 var(--space-5);
        }

        .suggestion-btn {
            min-height: 40px;
            padding: 0 var(--space-4);
            border: 1px solid var(--ink);
            border-radius: var(--radius);
            background: var(--white);
            color: var(--ink);
            font-family: var(--font-text);
            font-size: var(--text-sm);
            font-weight: 500;
            cursor: pointer;
            transition: background-color 120ms ease, color 120ms ease;
        }
        .suggestion-btn:hover { background: var(--ink); color: var(--white); }
        .suggestion-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* Product card */
        .product-card {
            max-width: 420px;
            margin-top: var(--space-3);
            padding: var(--space-4);
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            text-align: left;
        }
        .product-card .product-photo {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 5;
            max-height: 280px;
            object-fit: cover;
            background: var(--stone);
            border: 1px solid var(--line);
            margin-bottom: var(--space-3);
        }
        .product-card h4 { font-size: var(--text-lg); font-weight: 500; margin-bottom: var(--space-1); }
        .product-card p { font-size: var(--text-sm); color: var(--ink-soft); }
        .product-card .price {
            margin-top: var(--space-2);
            font-family: var(--font-mono);
            font-size: var(--text-lg);
            font-weight: 500;
            color: var(--ink);
            text-align: left;
        }
        .product-card .reasoning {
            margin-top: var(--space-3);
            padding: var(--space-2) var(--space-3);
            background: var(--ivory);
            border-left: 2px solid var(--accent);
            font-size: var(--text-sm);
            color: var(--ink);
        }
        .product-card .social-proof { margin-top: var(--space-2); font-size: var(--text-xs); color: var(--success); font-weight: 500; }
        .product-card .urgency { margin-top: var(--space-1); font-size: var(--text-xs); color: var(--danger); font-weight: 600; }

        /* Cart */
        .cart-display {
            max-width: 560px;
            margin: var(--space-2) 0;
            padding: var(--space-5);
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            text-align: left;
        }
        .cart-display h3 {
            margin: 0 0 var(--space-4);
            padding-bottom: var(--space-3);
            border-bottom: 1px solid var(--ink);
            font-size: var(--text-lg);
            font-weight: 500;
        }

        .cart-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-3);
            padding: var(--space-3) 0;
            border-bottom: 1px solid var(--line);
        }
        .cart-item:last-child { border-bottom: 0; }
        .cart-item-name { flex: 1 1 160px; font-size: var(--text-sm); font-weight: 500; }

        .cart-item-remove {
            min-width: 32px;
            height: 32px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--white);
            color: var(--danger);
            font-size: var(--text-md);
            cursor: pointer;
            transition: background-color 120ms ease, border-color 120ms ease;
        }
        .cart-item-remove:hover { background: var(--danger); border-color: var(--danger); color: var(--white); }

        .quantity-control { display: flex; align-items: center; gap: var(--space-2); }
        .quantity-control button {
            width: 32px;
            height: 32px;
            border: 1px solid var(--ink);
            border-radius: var(--radius);
            background: var(--white);
            color: var(--ink);
            font-size: var(--text-md);
            cursor: pointer;
            transition: background-color 120ms ease, color 120ms ease;
        }
        .quantity-control button:hover { background: var(--ink); color: var(--white); }
        .quantity-control button:disabled { opacity: 0.35; cursor: not-allowed; }
        .quantity-control span {
            min-width: 24px;
            text-align: center;
            font-family: var(--font-mono);
            font-size: var(--text-sm);
        }

        .cart-item-price {
            min-width: 80px;
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .cart-total {
            margin-top: var(--space-4);
            padding-top: var(--space-4);
            border-top: 1px solid var(--ink);
            text-align: right;
        }
        .cart-total strong { font-size: var(--text-md); font-weight: 600; }
        .cart-total #cartTotal { font-family: var(--font-mono); font-size: var(--text-lg); font-variant-numeric: tabular-nums; }
        .cart-total .discount-badge {
            display: inline-block;
            margin-left: var(--space-3);
            padding: 3px var(--space-2);
            border: 1px solid var(--success);
            border-radius: var(--radius);
            color: var(--success);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.08em;
            vertical-align: middle;
        }

        .agent-indicator {
            display: inline-block;
            margin: var(--space-2) 0 var(--space-4);
            padding: 3px var(--space-2);
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        /* Input bar */
        .chat-input-container {
            flex-shrink: 0;
            padding: var(--space-4) max(var(--gutter), calc((100% - 820px) / 2));
            background: var(--white);
            border-top: 1px solid var(--line);
        }

        .chat-input { display: flex; gap: var(--space-2); align-items: center; }

        .chat-input input {
            flex: 1;
            min-width: 0;
            min-height: 48px;
            padding: 0 var(--space-4);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--white);
            color: var(--ink);
            font-family: var(--font-text);
            font-size: var(--text-md);
        }
        .chat-input input:hover { border-color: var(--ink-soft); }
        .chat-input input:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
        .chat-input input::placeholder { color: var(--ink-soft); }

        .chat-input button {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            border: 1px solid var(--ink);
            border-radius: var(--radius);
            background: var(--ink);
            color: var(--white);
            cursor: pointer;
            transition: background-color 120ms ease, color 120ms ease;
        }
        .chat-input button:hover { background: #26343F; }
        .chat-input button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .chat-input button:disabled { background: var(--stone); border-color: var(--line); color: var(--ink-soft); cursor: not-allowed; }

        #voiceBtn { background: var(--white); color: var(--ink); }
        #voiceBtn:hover { background: var(--stone); }
        #voiceBtn.listening { background: var(--decision); border-color: var(--decision); color: var(--white); animation: listening 1s ease-in-out infinite; }
        @keyframes listening {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @media (max-width: 900px) {
            .chat-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
            .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
            .sidebar-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-3) var(--gutter); border-bottom: 0; }
            .sidebar-header h3 { margin: 0; }
            .new-chat-btn { width: auto; }
            .conversations-list { display: flex; overflow-x: auto; overflow-y: hidden; padding: 0; border-top: 1px solid var(--line); }
            .conversation-item { flex: none; width: 200px; border-bottom: 0; border-left: 0; border-right: 1px solid var(--line); border-top: 3px solid transparent; }
            .conversation-item.active { border-left-color: transparent; border-top-color: var(--ink); }
            .chat-header { padding: var(--space-3) var(--gutter); }
            .message-bubble { max-width: 88%; }
        }

        @media (max-width: 480px) {
            .wordmark-tag { display: none; }
            .conversations-list { display: none; }
        }
    </style>
    <script src="config.js"></script>
</head>
<body>
    <header class="app-bar">
        <div class="app-bar-inner bar-wide">
            <a class="wordmark" href="index.html">
                <span class="wordmark-name">Orchestrator</span>
                <span class="wordmark-tag">Web chat</span>
            </a>
            <div class="app-bar-meta">
                <div class="language-selector">
                    <svg class="icon icon-sm" aria-hidden="true"><use href="icons.svg#globe"/></svg>
                    <label class="visually-hidden" for="languageSelect">Language</label>
                    <select id="languageSelect" onchange="changeLanguage()">
                        <option value="en">English</option>
                        <option value="hi">हिंदी (Hindi)</option>
                        <option value="mr">मराठी (Marathi)</option>
                        <option value="gu">ગુજરાતી (Gujarati)</option>
                        <option value="ta">தமிழ் (Tamil)</option>
                        <option value="te">తెలుగు (Telugu)</option>
                        <option value="bn">বাংলা (Bengali)</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <div class="chat-layout">
        <!-- Sidebar for conversation history -->
        <aside class="sidebar" aria-label="Conversation history">
            <div class="sidebar-header">
                <h3 class="label">Conversations</h3>
                <button class="btn btn-secondary new-chat-btn" onclick="createNewConversation()">
                    <svg class="icon icon-sm" aria-hidden="true"><use href="icons.svg#plus"/></svg>
                    New chat
                </button>
            </div>
            <div class="conversations-list" id="conversationsList">
                <!-- Conversations will be loaded here -->
            </div>
        </aside>

        <!-- Main chat container -->
        <main class="chat-container">
            <div class="chat-header">
                <div class="avatar"><svg class="icon icon-lg" aria-hidden="true"><use href="icons.svg#chat"/></svg></div>
                <div class="header-info">
                    <h2>Van Heusen AI Assistant</h2>
                    <div class="status">
                        <span class="status-dot"></span>
                        <span id="statusText">Online - AI Powered</span>
                    </div>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="Conversation">
                <!-- Messages will be added here -->
            </div>

            <div class="chat-input-container">
                <div class="chat-input">
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Ask me anything about products, stores, or orders..."
                        aria-label="Message"
                        autocomplete="off"
                    >
                    <button id="voiceBtn" onclick="toggleVoice()" title="Voice Input" aria-label="Voice input"><svg class="icon" aria-hidden="true"><use href="icons.svg#mic"/></svg></button>
                    <button id="sendBtn" onclick="sendMessage()" title="Send" aria-label="Send message"><svg class="icon" aria-hidden="true"><use href="icons.svg#send"/></svg></button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let ws = null;
        let isProcessing = false;

        // Voice Recognition
        let recognition = null;
        let isListening = false;
        let voiceEnabled = false;
        
        // Multilingual Support
        let currentLanguage = localStorage.getItem('vh_language') || 'en';

        // Cart tracking
        let cartItems = [];
        
        // Replace the local cart with the backend cart (shared with WhatsApp)
        async function syncCartFromBackend() {
            try {
                const response = await fetch(`${API_URL}/api/cart/${sessionId}`);
                if (!response.ok) return;
                const data = await response.json();
                cartItems = data.items.map(item => ({
                    id: item.product_id, name: item.name, price: item.price, quantity: item.quantity
                }));
                localStorage.setItem('cartItems', JSON.stringify(cartItems));
            } catch (error) {
                console.error('Could not load the cart from the backend:', error);
            }
        }

        // Track activity for store dashboard
        function trackActivity(channel, action) {
            const activities = JSON.parse(localStorage.getItem('recentActivity') || '[]');
            activities.push({
                channel: channel,
                action: action,
                timestamp: new Date().toISOString()
            });
            // Keep only last 10 activities
            if (activities.length > 10) {
                activities.splice(0, activities.length - 10);
            }
            localStorage.setItem('recentActivity', JSON.stringify(activities));
        }

        // Conversation Management
        let conversations = JSON.parse(localStorage.getItem('vh_conversations') || '[]');
        let currentConversationId = localStorage.getItem('vh_current_conversation') || null;
        
        // Legacy session support
        const sessionId = localStorage.getItem('session_id') || 'SESSION_web_' + Date.now();
        const isNewSession = !localStorage.getItem('session_id');
        if (isNewSession) {
            localStorage.setItem('session_id', sessionId);
        }

        // Conversation context tracking (SALES PSYCHOLOGY)
        let conversationContext = {
            occasion: null,
            colorPreference: null,
            objections: [],
            productsShown: false
        };

        // Initialize
        window.onload = () => {
            loadAvailability();
            // Check URL parameters to see if we're coming from another interface
            const urlParams = new URLSearchParams(window.location.search);
            const hasSessionParam = urlParams.has('session');
            const currentStep = localStorage.getItem('current_step');
            
            // If opening chat.html directly (no session param) AND not continuing from mobile/WhatsApp,
            // clear everything for a fresh start
            if (!hasSessionParam && (!currentStep || currentStep === '0' || currentStep === '1')) {
                // Clear cart and session for fresh start
                cartItems = [];
                localStorage.removeItem('cartItems');
                localStorage.removeItem('likedProducts');
                localStorage.removeItem('current_step');
                console.log('Starting fresh session - cart cleared');
            } else {
                // Continuing from mobile/WhatsApp - preserve cart
                const savedCart = localStorage.getItem('cartItems');
                if (savedCart) {
                    cartItems = JSON.parse(savedCart);
                    console.log('Loaded cart from previous session:', cartItems.length, 'items');
                }
                // The backend holds the real shared cart (same one WhatsApp uses)
                syncCartFromBackend();
            }
            
            loadConversations();
            if (!currentConversationId || !findConversation(currentConversationId)) {
                createNewConversation();
            } else {
                loadConversation(currentConversationId);
            }
            connectWebSocket();
            initVoiceRecognition();
            initLanguage();
        };

        function findConversation(id) {
            return conversations.find(c => c.id === id);
        }

        function createNewConversation() {
            const newConvo = {
                id: 'conv_' + Date.now(),
                title: 'New Conversation',
                messages: [],
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            conversations.unshift(newConvo);
            currentConversationId = newConvo.id;
            saveConversations();
            loadConversations();
            clearChatMessages();
            initializeChat();
        }

        function loadConversations() {
            const list = document.getElementById('conversationsList');
            list.innerHTML = '';
            
            conversations.forEach(convo => {
                const item = document.createElement('div');
                item.className = 'conversation-item' + (convo.id === currentConversationId ? ' active' : '');
                item.onclick = () => switchConversation(convo.id);
                
                const date = new Date(convo.updatedAt);
                const dateStr = formatDate(date);
                
                item.innerHTML = `
                    <div class="conversation-title">${convo.title}</div>
                    <div class="conversation-date">${dateStr}</div>
                `;
                list.appendChild(item);
            });
        }

        function formatDate(date) {
            const now = new Date();
            const diff = now - date;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            if (days === 0) return 'Today';
            if (days === 1) return 'Yesterday';
            if (days < 7) return `${days} days ago`;
            return date.toLocaleDateString();
        }

        function switchConversation(id) {
            if (id === currentConversationId) return;
            
            saveCurrentConversation();
            currentConversationId = id;
            localStorage.setItem('vh_current_conversation', id);
            loadConversation(id);
            loadConversations();
        }

        function loadConversation(id) {
            const convo = findConversation(id);
            if (!convo) return;
            
            clearChatMessages();
            convo.messages.forEach(msg => {
                if (msg.type === 'bot') {
                    addBotMessage(msg.text, false);
                } else {
                    addUserMessage(msg.text, false);
                }
            });
            
            // Scroll to bottom
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function saveCurrentConversation() {
            const convo = findConversation(currentConversationId);
            if (!convo) return;
            
            const chatMessages = document.getElementById('chatMessages');
            const messages = [];
            
            chatMessages.querySelectorAll('.message').forEach(msgEl => {
                const isBot = msgEl.classList.contains('bot');
                const bubble = msgEl.querySelector('.message-bubble');
                if (bubble) {
                    messages.push({
                        type: isBot ? 'bot' : 'user',
                        text: bubble.textContent
                    });
                }
            });
            
            convo.messages = messages;

        function connectWebSocket() {
            // Don't block page load - connect WebSocket asynchronously
            setTimeout(() => {
                try {
                    console.log('Attempting WebSocket connection...');
                    ws = new WebSocket(socketUrl(sessionId));
                    
                    // Set a timeout for connection
                    const connectionTimeout = setTimeout(() => {
                        if (ws.readyState !== WebSocket.OPEN) {
                            console.log('WebSocket connection timeout, using fallback');
                            updateStatus('Using fallback mode', false);
                            ws.close();
                        }
                    }, 2000); // 2 second timeout
                    
                    ws.onopen = () => {
                        clearTimeout(connectionTimeout);
                        console.log('WebSocket connected');
                        updateStatus('Online - AI Powered', true);
                    };
                    
                    ws.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        handleWebSocketMessage(data);
                    };
                    
                    ws.onerror = () => {
                        clearTimeout(connectionTimeout);
                        updateStatus('Using fallback mode', false);
                    };
                    
                    ws.onclose = () => {
                        clearTimeout(connectionTimeout);
                        updateStatus('Reconnecting...', false);
                        setTimeout(connectWebSocket, 3000);
                    };
                } catch (error) {
                    console.error('WebSocket error:', error);
                    updateStatus('Using fallback mode', false);
                }
            }, 100); // Delay WebSocket connection to not block page rendering
        }

        // Text-to-Speech Function
        function speakResponse(text) {
            if (!('speechSynthesis' in window)) {
                console.warn('Text-to-speech not supported');
                return;
            }

            // Cancel any ongoing speech
            window.speechSynthesis.cancel();

            // Clean text for speech (remove markdown, emojis, special characters)
            const cleanText = text
                .replace(/\*\*(.+?)\*\*/g, '$1')  // Remove bold
                .replace(/\*(.+?)\*/g, '$1')      // Remove italic
                .replace(/[🎉💝🎁✨🌟💎🛍️🎊👔💼🎯📦🏪🚚💰⭐🔥💯✅❌🎤➤]/g, '')  // Remove emojis
                .replace(/\[(.+?)\]\(.+?\)/g, '$1')  // Extract link text
                .replace(/\n/g, '. ');  // Replace newlines with pauses

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-IN';  // Indian English
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.volume = 0.9;

            window.speechSynthesis.speak(utterance);
        }

        async function translateText(text, targetLang) {

            try {

                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        source_lang: 'auto',
                        target_lang: targetLang
                    })
                });
                
                const data = await response.json();
                return data.translated_text || text;
            } catch (error) {
                console.error('Translation error:', error);
                return text;  // Fallback to original
            }
        }

        async function updateQuantity(productId, unitPrice, change) {
            const qtyEl = document.getElementById(`qty-${productId}`);
            const currentQty = parseInt(qtyEl.textContent);
            const newQty = currentQty + change;
            
            if (newQty < 1) return;
            
            // Update cartItems array
            const item = cartItems.find(i => i.id === productId);
            if (item) {
                item.quantity = newQty;
            }
            
            // Update UI immediately (real-time)
            qtyEl.textContent = newQty;
            
            // Recalculate totals from cartItems array
            let subtotal = 0;
            cartItems.forEach(item => {
                const itemQty = item.quantity || 1;
                const itemTotal = item.price * itemQty;
                subtotal += itemTotal;
                
                // Update individual item price display
                const priceEl = document.getElementById(`price-${item.id}`);
                if (priceEl) {
                    priceEl.textContent = `₹${itemTotal.toLocaleString()}`;
                }
            });
            
            // Tell the backend, then show the price it works out
            try {
                await fetch(`${API_URL}/api/cart/update`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({session_id: sessionId, product_id: productId, quantity: newQty})
                });
            } catch (error) {
                console.error('Cart update error:', error);
            }
            await refreshPricing();
            const total = payableTotal(subtotal);
            document.getElementById('cartTotal').textContent = `₹${total.toLocaleString()}`;
            document.getElementById('discountBadge').textContent = offerBadgeText();
            addBotMessage(`Cart updated! New total: ₹${total.toLocaleString()}`);
            
        }

        // ---- Streaming replies -------------------------------------------------
        // The backend sends the reply as server-sent events: "progress" (agent and payment
        // steps), "token" (the next few words of the text) and "done" (the full reply).

        // Read a server-sent event stream and call onEvent(name, data) for each event
        async function readEventStream(response, onEvent) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            while (true) {
                const {value, done} = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, {stream: true});
                let boundary;
                while ((boundary = buffer.indexOf('\n\n')) !== -1) {
                    const block = buffer.slice(0, boundary);
                    buffer = buffer.slice(boundary + 2);
                    const name = /^event: (.*)$/m.exec(block)[1];
                    const data = JSON.parse(/^data: (.*)$/m.exec(block)[1]);
                    onEvent(name, data);
                }
            }
        }

        // A bot message that grows as text arrives. finish() saves it and reads it aloud, like addBotMessage.
        function startStreamingBotMessage() {
            const container = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = 'message bot';
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            msg.appendChild(bubble);
            container.appendChild(msg);

            const format = (text) => text
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/•/g, '&nbsp;&nbsp;•')
                .replace(/\n/g, '<br>');
            let text = '';

            return {
                append(piece) {
                    text += piece;
                    bubble.innerHTML = format(text);
                    container.scrollTop = container.scrollHeight;
                },
                finish() {
                    bubble.innerHTML = `${format(text)}<span class="message-time">${getCurrentTime()}</span>`;
                    container.scrollTop = container.scrollHeight;
                    speakResponse(text);
                    const convo = findConversation(currentConversationId);
                    if (convo) {
                        convo.messages.push({ type: 'bot', text: text });
                        convo.updatedAt = new Date().toISOString();
                        saveConversations();
                    }
                }
            };
        }

        // POST to a streaming endpoint and show the reply as it arrives. Returns the full reply.
        async function streamChatReply(path, body) {
            const response = await fetch(`${API_URL}${path}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            if (!response.ok || !response.body) {
                throw new Error(`Stream request failed: ${response.status}`);
            }

            let bubble = null;
            let reply = null;
            await readEventStream(response, (name, data) => {
                if (name === 'progress') {
                    if (data.type === 'input_blocked') {
                        addBotMessage('Message blocked by the prompt-injection guard.');
                    } else if (data.type === 'agent_called' && data.status === 'processing' && (!ws || ws.readyState !== WebSocket.OPEN)) {
                        showAgentActivity(data.agent);
                    }
                } else if (name === 'token') {
                    if (!bubble) {
                        removeTypingIndicator();
                        bubble = startStreamingBotMessage();
                    }
                    bubble.append(data.text);
                } else if (name === 'done') {
                    reply = data;
                }
            });

            removeTypingIndicator();
            if (!reply) {
                throw new Error('The reply stream ended early');
            }
            if (bubble) {
                bubble.finish();
            }
            return reply;
        }

        async function sendMessage() {
            if (isProcessing) return;

                addBotMessage(cartItems.length === 0

                    : `${useThem ? 'Your loyalty points are applied.' : 'Your loyalty points are not used, so they stay in your account.'}\n\n${cartSummaryText(itemSubtotal, itemCount)}`);

                addNextStepSuggestions();
                isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('voiceBtn').disabled = false;
                return;
            }

            // Ask the backend. If the request fails, use the built-in smart fallback.
            try {
                const chatBody = {
                    session_id: sessionId,
                    message: messageInEnglish,
                    channel: 'web'
                };
                let data;
                if (currentLanguage === 'en') {
                    // English replies stream in word by word
                    data = await streamChatReply('/api/chat/stream', chatBody);
                } else {
                    // Other languages are translated as a whole, so they cannot stream
                    const response = await fetch(`${API_URL}/api/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(chatBody)
                    });

                    if (!response.ok) {
                        throw new Error(`Chat request failed: ${response.status}`);
                    }
                    data = await response.json();

                    removeTypingIndicator();

                    if (data.blocked) {
                        addBotMessage('Message blocked by the prompt-injection guard.');
                    }
                    if (data.response) {
                        addBotMessage(await translateText(data.response, currentLanguage));
                    }
                }
                syncCartFromBackend();

                if (data.pending_approval) {
                    addApprovalButtons();
                } else {
                    if (data.recommendations && data.recommendations.length > 0) {
                        setTimeout(() => {
                            addBotMessage("Here are some recommendations:");

                                setTimeout(() => addProductCard({...product, id: product.product_id}), index * 200);
                            });

                    }

                    if (!addContextualSuggestions(messageInEnglish)) {
                        addNextStepSuggestions();
                    }
                }

            } catch (error) {
                console.error('Error:', error);
                removeTypingIndicator();

                // Use our intelligent response system (in English)
                const smartResponse = getSmartFallback(messageInEnglish);

                // Translate response to user's language
                let responseInUserLang = smartResponse;
                if (currentLanguage !== 'en') {
                    responseInUserLang = await translateText(smartResponse, currentLanguage);
                }

                addBotMessage(responseInUserLang);

                // Add contextual suggestions
                addContextualSuggestions(messageInEnglish);
            }
            
            // Re-enable input
            isProcessing = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('voiceBtn').disabled = false;
        }

        function addContextualSuggestions(message) {
            const msg = message.toLowerCase();
            let suggestions = [];
            
            // Note: Most suggestions are now added inline in getSmartFallback, so this function
            // only handles a few legacy cases to avoid duplicates
            
            // After complete outfit shown
            if (msg.includes('complete outfit') || (msg.includes('outfit') && !msg.includes('need') && !msg.includes('looking'))) {
                suggestions = ["Add bundle to cart", "See in-store", "Modify selections", "Add formal trousers"];
            }
            // After "see in-store" 
            else if (msg.includes('see in-store') || msg.includes('see in store')) {
                suggestions = ["Reserve at Bandra (2km)", "Reserve at Powai (5km)", "Get directions", "Call store for details"];
            }
            // After store reservation
            else if (msg.includes('reserve at')) {
                suggestions = ["Get directions to Bandra", "Call store", "Proceed to checkout", "Continue shopping"];
            }
            // Default helpful suggestions (only if no specific match and early in conversation)
            else if (!msg.includes('accessor') && !msg.includes('shirt') && !msg.includes('recommend') && !msg.includes('new') && !msg.includes('stock') && !msg.includes('direction') && !msg.includes('call')) {
                const convo = findConversation(currentConversationId);
                const messageCount = convo ? convo.messages.length : 0;
                
                // Only show default suggestions if conversation just started
                if (messageCount <= 2) {
                    suggestions = ["Looking for formal wear", "Need outfit suggestions", "Check my cart", "Store locations"];
                }
            }
            
            // Add suggestions if we found any
            if (suggestions.length > 0) {
                setTimeout(() => addSuggestions(suggestions), 300);
                return true;
            }
            return false;
        }

        // Never leave the customer at a dead end: offer sensible next steps
        function addNextStepSuggestions() {
            const suggestions = cartItems.length > 0
                ? ["Checkout", "Show recommendations", "Check store availability", "View my cart"]
                : ["Show formal shirts", "Need outfit suggestions", "Store locations", "View my cart"];
            setTimeout(() => addSuggestions(suggestions), 300);
        }

        // Ask how the shopping process was, after an order is confirmed
        function askForRating(orderId) {
            addBotMessage('Your order is placed. How was your shopping experience with us? Please rate it.');
            const container = document.getElementById('chatMessages');
            const buttonsDiv = document.createElement('div');
            buttonsDiv.className = 'suggestions';
            [['5 - Excellent', 5], ['4 - Good', 4], ['3 - Average', 3], ['2 - Poor', 2], ['1 - Very poor', 1]].forEach(([text, rating]) => {
                const btn = document.createElement('button');
                btn.className = 'suggestion-btn';
                btn.textContent = text;
                btn.onclick = async () => {
                    buttonsDiv.remove();
                    addUserMessage(`${rating} out of 5`);
                    try {
                        await fetch(`${API_URL}/api/feedback/rating`, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({session_id: sessionId, rating: rating, order_id: orderId})
                        });
                    } catch (error) {
                        console.error('Error sending rating:', error);
                    }
                    addBotMessage(rating >= 4
                        ? 'Thank you, we are glad you enjoyed it. Is there anything else you need today?'
                        : 'Thank you for telling us. We will use it to do better. Is there anything we can fix for you now?');
                    addNextStepSuggestions();
                };
                buttonsDiv.appendChild(btn);
            });
            container.appendChild(buttonsDiv);
            container.scrollTop = container.scrollHeight;
        }

        function isUsePointsRequest(message) {
            return !isKeepPointsRequest(message) && /(use|apply|redeem).*(loyalty|points)/i.test(message);
        }

        function isKeepPointsRequest(message) {
            return /(keep|save|don'?t use|do not use|remove|skip).*(loyalty|points)/i.test(message);
        }

        // Cart questions are answered here, from the shared cart
        function isCartViewRequest(message) {
            const text = message.toLowerCase();
            return /\bcart\b/.test(text) && !/(checkout|pay|buy|purchase|discount|offer|add|remove)/.test(text);
        }

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: true 
            });
        }

        // Enter key to send
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isProcessing) {
                sendMessage();
            }
        });
    </script>
</body>
</html>
