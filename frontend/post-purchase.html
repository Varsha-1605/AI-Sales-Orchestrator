<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-Purchase Follow-up - Van Heusen AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Page: post-purchase follow-up. Roomy and editorial, one reading column. */
        .page { max-width: 760px; padding-top: var(--space-7); padding-bottom: var(--space-8); }

        .header { padding-bottom: var(--space-6); border-bottom: 2px solid var(--ink); }
        .header h1 { margin-top: var(--space-2); font-size: var(--text-3xl); font-weight: 500; letter-spacing: -0.02em; }
        .header p.subtitle { margin-top: var(--space-3); font-size: var(--text-lg); color: var(--ink-soft); }

        .section-title {
            margin: var(--space-7) 0 var(--space-4);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        /* Order timeline (items rendered by the script) */
        .timeline { margin-top: var(--space-6); }
        .timeline-item {
            position: relative;
            display: flex;
            gap: var(--space-5);
            padding-bottom: var(--space-6);
        }
        .timeline-item:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 21px;
            top: 48px;
            bottom: 4px;
            width: 1px;
            background: var(--line);
        }
        .timeline-icon {
            display: grid;
            place-items: center;
            flex: none;
            width: 44px;
            height: 44px;
            border: 1px solid var(--ink-soft);
            border-radius: var(--radius);
            background: var(--white);
            color: var(--ink-soft);
        }
        .timeline-icon.completed { border-color: var(--success); color: var(--success); }
        .timeline-icon.pending { border-color: var(--accent); color: var(--accent); }

        .timeline-content { flex: 1; min-width: 0; }
        .timeline-content h3 { font-size: var(--text-lg); font-weight: 500; }
        .timeline-content p { margin-top: var(--space-1); color: var(--ink-soft); line-height: 1.6; }
        .timeline-content .timestamp {
            margin-top: var(--space-2);
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.04em;
            color: var(--ink-soft);
        }
        .whatsapp-message {
            margin-top: var(--space-3);
            padding: var(--space-3) var(--space-4);
            border-left: 2px solid var(--accent);
            background: var(--white);
            font-family: var(--font-display);
            font-size: var(--text-md);
            font-style: italic;
            line-height: 1.5;
            color: var(--ink);
        }

        /* Rating and quick actions */
        .action-card { padding: var(--space-6); background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); }
        .action-card h3 { font-size: var(--text-xl); font-weight: 500; }
        .action-card .lead { margin-top: var(--space-2); color: var(--ink-soft); }

        .rating-stars { display: flex; gap: var(--space-2); margin: var(--space-5) 0 var(--space-3); }
        .star {
            display: grid;
            place-items: center;
            width: 52px;
            height: 52px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--white);
            color: var(--line);
            cursor: pointer;
            transition: color 120ms ease, border-color 120ms ease;
        }
        .star .icon { width: 28px; height: 28px; }
        .star:hover { border-color: var(--accent); color: var(--accent); }
        .star:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .star.active { border-color: var(--accent); color: var(--accent); }
        .star.active .icon { fill: var(--accent); }
        #ratingFeedback { min-height: 24px; font-weight: 500; color: var(--accent); }

        .quick-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); margin-top: var(--space-5); }
        .action-btn {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            min-height: 52px;
            padding: 0 var(--space-4);
            border: 1px solid var(--ink);
            border-radius: var(--radius);
            background: var(--white);
            color: var(--ink);
            font-family: var(--font-text);
            font-size: var(--text-sm);
            font-weight: 600;
            cursor: pointer;
            transition: background-color 120ms ease, color 120ms ease;
        }
        .action-btn:hover { background: var(--ink); color: var(--white); }
        .action-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* Recommendations (rows rendered by the script) */
        .recommendation-section { padding: var(--space-6); border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); }
        .recommendation-section h3 { font-size: var(--text-xl); font-weight: 500; }
        .recommendation-section > p { margin: var(--space-2) 0 var(--space-4); color: var(--ink-soft); }
        .product-recommendation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-4);
            padding: var(--space-4) 0;
            border-top: 1px solid var(--line);
        }
        .product-info-rec { flex: 1; color: var(--ink-soft); font-size: var(--text-sm); }
        .product-info-rec strong { display: block; margin-bottom: var(--space-1); font-family: var(--font-display); font-size: var(--text-lg); font-weight: 500; color: var(--ink); }
        .product-info-rec .price { font-family: var(--font-mono); font-size: var(--text-md); font-variant-numeric: tabular-nums; color: var(--ink); }
        .add-btn {
            min-height: 44px;
            padding: 0 var(--space-5);
            border: 1px solid var(--ink);
            border-radius: var(--radius);
            background: var(--ink);
            color: var(--white);
            font-family: var(--font-text);
            font-size: var(--text-sm);
            font-weight: 600;
            cursor: pointer;
            transition: background-color 120ms ease;
        }
        .add-btn:hover { background: #26343F; }
        .add-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .special-offer {
            margin-top: var(--space-4);
            padding: var(--space-3) var(--space-4);
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            color: var(--accent);
            font-weight: 600;
            text-align: center;
        }

        /* Loyalty footer */
        .footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);
            margin-top: var(--space-7);
            padding-top: var(--space-5);
            border-top: 2px solid var(--ink);
        }
        .footer p { margin: 0; }
        .footer .next-reward { margin-top: var(--space-1); font-size: var(--text-sm); color: var(--ink-soft); }
        #pointsEarned { font-family: var(--font-mono); font-weight: 500; }

        @media (max-width: 600px) {
            .header h1 { font-size: var(--text-2xl); }
            .action-card, .recommendation-section { padding: var(--space-5); }
            .quick-actions { grid-template-columns: 1fr; }
            .product-recommendation { flex-direction: column; align-items: flex-start; }
            .wordmark-tag { display: none; }
        }
    </style>
    <script src="config.js"></script>
</head>
<body>
    <header class="app-bar">
        <div class="container app-bar-inner">
            <a class="wordmark" href="index.html">
                <span class="wordmark-name">Orchestrator</span>
                <span class="wordmark-tag">Order follow-up</span>
            </a>
            <div class="app-bar-meta">
                <span class="label">Step 6 of 6</span>
            </div>
        </div>
    </header>

    <main class="container page">
        <!-- Header -->
        <div class="header">
            <p class="label">Post-purchase</p>
            <h1 id="headerTitle">Thank You, Rahul!</h1>
            <p class="subtitle" id="headerSubtitle">Your order journey & personalized care</p>
        </div>

        <!-- Order Timeline -->
        <div class="timeline" id="timelineContainer">
            <!-- Timeline items will be dynamically generated -->
        </div>

        <!-- Rating Card -->
        <h2 class="section-title">Your feedback</h2>
        <div class="action-card">
            <h3>Rate Your Experience</h3>
            <p class="lead">How was your shopping journey with us?</p>
            <div class="rating-stars" id="ratingStars" role="group" aria-label="Rating">
                <button class="star" data-rating="1" aria-label="1 star"><svg class="icon" aria-hidden="true"><use href="icons.svg#star"/></svg></button>
                <button class="star" data-rating="2" aria-label="2 stars"><svg class="icon" aria-hidden="true"><use href="icons.svg#star"/></svg></button>
                <button class="star" data-rating="3" aria-label="3 stars"><svg class="icon" aria-hidden="true"><use href="icons.svg#star"/></svg></button>
                <button class="star" data-rating="4" aria-label="4 stars"><svg class="icon" aria-hidden="true"><use href="icons.svg#star"/></svg></button>
                <button class="star" data-rating="5" aria-label="5 stars"><svg class="icon" aria-hidden="true"><use href="icons.svg#star"/></svg></button>
            </div>
            <p id="ratingFeedback" role="status"></p>
            <div class="quick-actions">
                <button class="action-btn" onclick="showSupport()">
                    <svg class="icon" aria-hidden="true"><use href="icons.svg#chat"/></svg>
                    Need Help?
                </button>
                <button class="action-btn" onclick="trackOrder()">
                    <svg class="icon" aria-hidden="true"><use href="icons.svg#map-pin"/></svg>
                    Track Order
                </button>
                <button class="action-btn" onclick="viewInvoice()">
                    <svg class="icon" aria-hidden="true"><use href="icons.svg#receipt"/></svg>
                    View Invoice
                </button>
                <button class="action-btn" onclick="initiateReturn()">
                    <svg class="icon" aria-hidden="true"><use href="icons.svg#refresh"/></svg>
                    Easy Returns
                </button>
            </div>
        </div>

        <!-- AI Recommendations -->
        <h2 class="section-title">Recommended for you</h2>
        <div class="recommendation-section" id="recommendationsSection">
            <!-- Recommendations will be dynamically generated based on purchased items -->
        </div>

        <!-- Footer -->
        <div class="footer" id="loyaltyFooter">
            <div>
                <p>Your loyalty: <strong id="pointsEarned">0 points earned</strong> • Gold Member</p>
                <p class="next-reward">Next reward at 1,000 points</p>
            </div>
            <button class="btn btn-secondary" onclick="backToHome()">
                <svg class="icon icon-sm" aria-hidden="true"><use href="icons.svg#arrow-left"/></svg>
                Back to Dashboard
            </button>
        </div>
    </main>

    <script>
        const sessionId = localStorage.getItem('session_id');
        let purchasedItems = [];
        let orderTotal = 0;
        let orderNumber = '';
        
        // All available products for recommendations
        const allProducts = [
            {id: 'VH001', name: 'Classic Blue Formal Shirt', price: 2500, category: 'shirts', reasoning: 'Premium wrinkle-resistant fabric', buyRate: '287 customers this month'},
            {id: 'VH004', name: 'Navy Blue Silk Tie', price: 800, category: 'ties', reasoning: '85% of shirt buyers also got this', buyRate: 'Bestseller for formal'},
            {id: 'VH008', name: 'Blue Formal Trousers', price: 2200, category: 'trousers', reasoning: 'Perfect match - 85% buy together', buyRate: 'Top choice for professionals'},
            {id: 'VH008C', name: 'Black Formal Trousers', price: 2300, category: 'trousers', reasoning: 'Essential for power dressing - 92% buy together', buyRate: 'Most popular choice'},
            {id: 'VH002', name: 'White Premium Formal Shirt', price: 2800, category: 'shirts', reasoning: 'Timeless professional staple', buyRate: '320 sold this month'},
            {id: 'VH006', name: 'Brown Leather Belt', price: 1200, category: 'accessories', reasoning: 'Essential formal accessory', buyRate: '92% match with trousers'},
            {id: 'VH013', name: 'Black Formal Shoes', price: 3800, category: 'shoes', reasoning: 'Complete professional look - 85% buy together', buyRate: 'Premium quality'},
            {id: 'VH007', name: 'Black Leather Belt', price: 1300, category: 'accessories', reasoning: 'Classic essential', buyRate: '88% match rate'},
            {id: 'VH003', name: 'Light Pink Formal Shirt', price: 2600, category: 'shirts', reasoning: 'Modern versatile fit', buyRate: 'Trending style'},
            {id: 'VH005B', name: 'Striped Silk Tie', price: 750, category: 'ties', reasoning: 'Bold professional statement - 78% buy together', buyRate: 'Premium collection'},
            {id: 'VH001B', name: 'Light Blue Formal Shirt', price: 2450, category: 'shirts', reasoning: 'Summer formal favorite', buyRate: 'Just restocked'},
            {id: 'VH012', name: 'Blue Formal Shoes', price: 3500, category: 'shoes', reasoning: 'Versatile formal look', buyRate: 'Premium quality'},
            {id: 'VH014', name: 'Blue Formal Socks', price: 300, category: 'accessories', reasoning: 'Elegant finishing touch', buyRate: 'Wedding bestseller'},
            {id: 'VH015', name: 'Black Formal Socks', price: 300, category: 'accessories', reasoning: 'Everyday essential', buyRate: 'Pairs with every outfit'}
        ];

        // Rating System
        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', function() {
                const rating = this.dataset.rating;
                document.querySelectorAll('.star').forEach((s, idx) => {
                    if (idx < rating) {
                        s.classList.add('active');
                    } else {
                        s.classList.remove('active');
                    }
                });
                
                const feedback = document.getElementById('ratingFeedback');
                const messages = {
                    '1': 'We appreciate your feedback. Let us make it better!',
                    '2': 'Thank you! We\'ll work on improving your experience.',
                    '3': 'Good! We\'re always looking to improve.',
                    '4': 'Great! We\'re glad you enjoyed shopping with us!',
                    '5': 'Excellent! Thank you for being an amazing customer!'
                };
                feedback.textContent = messages[rating];

                // Send rating to backend
                sendRating(rating);
            });
        });

        async function sendRating(rating) {
            try {
                await fetch(`${API_URL}/api/feedback/rating`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        session_id: sessionId,
                        rating: parseInt(rating),
                        order_id: 'VH2025001'
                    })
                });
                console.log('Rating sent:', rating);
            } catch (error) {
                console.error('Error sending rating:', error);
            }
        }

        function showSupport() {
            alert('Support Chat\n\n' +
                  'Hi Rahul! How can we help?\n\n' +
                  '• Track your order\n' +
                  '• Initiate return/exchange\n' +
                  '• Sizing questions\n' +
                  '• Product recommendations\n\n' +
                  'Reply anytime - we\'re here 24/7!');
        }

        function trackOrder() {
            const itemCount = purchasedItems.length;
            const itemText = itemCount === 1 ? `${purchasedItems[0].name}` : `${itemCount} items`;
            
            alert('Order Tracking\n\n' +
                  `Order: ${orderNumber}\n` +
                  'Status: Out for Delivery\n' +
                  `Items: ${itemText}\n\n` +
                  'Estimated Delivery: Tomorrow 10 AM\n' +
                  'Delivery Partner: BlueDart\n' +
                  `Tracking ID: BD${orderNumber.replace('#VH', '')}\n\n` +
                  'Live tracking link sent to WhatsApp!');
        }

        function viewInvoice() {
            const subtotal = purchasedItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const total = orderTotal > 0 ? orderTotal : subtotal;
            const discount = subtotal - total;
            
            let itemsList = '';
            purchasedItems.forEach(item => {
                itemsList += `• ${item.name}${item.size ? ' (Size ' + item.size + ')' : ''} - ₹${item.price.toLocaleString()}\n`;
            });
            
            alert('Invoice Details\n\n' +
                  `Order: ${orderNumber}\n` +
                  'Date: ' + new Date().toLocaleDateString() + '\n\n' +
                  'Items:\n' +
                  itemsList + '\n' +
                  `Subtotal: ₹${subtotal.toLocaleString()}\n` +
                  `Offers and loyalty points: -₹${discount.toLocaleString()}\n` +
                  `Total: ₹${total.toLocaleString()}\n\n` +
                  'PDF invoice sent to your email!');
        }

        function initiateReturn() {
            const itemCount = purchasedItems.length;
            const itemList = purchasedItems.map(item => `• ${item.name}`).join('\n');
            
            alert('Easy Returns\n\n' +
                  `Order: ${orderNumber}\n` +
                  `Items in this order:\n${itemList}\n\n` +
                  '30-day return policy\n' +
                  'Free pickup from your doorstep\n' +
                  'Instant refund on acceptance\n\n' +
                  'To return:\n' +
                  '1. Keep tags intact\n' +
                  '2. Click "Initiate Return" on WhatsApp\n' +
                  '3. Schedule pickup\n\n' +
                  'Questions? We\'re here to help!');
        }

        function addToCart(item) {
            const items = {
                'trousers': 'Navy Formal Trousers',
                'wallet': 'Premium Leather Wallet',
                'shoes': 'Formal Shoes (Black)'
            };
            
            alert('Added to Cart!\n\n' +
                  items[item] + ' has been added.\n\n' +
                  'Total items: ' + (Math.floor(Math.random() * 3) + 2) + '\n' +
                  'Special offer active: 15% off on 2+ items!\n\n' +
                  'Continue shopping or checkout?');
        }

        function backToHome() {
            window.location.href = `index.html?session=${sessionId}`;
        }

        function loadPurchasedItems() {
            // Load purchased items from localStorage
            const savedCart = localStorage.getItem('cartItems');
            const savedTotal = localStorage.getItem('orderTotal');
            
            if (savedCart) {
                purchasedItems = JSON.parse(savedCart);
            }
            
            if (savedTotal) {
                orderTotal = parseFloat(savedTotal);
            }
            
            // Generate order number based on session and timestamp
            const orderDate = new Date();
            const orderSuffix = String(orderDate.getHours()).padStart(2, '0') + String(orderDate.getMinutes()).padStart(2, '0');
            orderNumber = `#VH2026${orderSuffix}`;
            
            console.log('Purchased items:', purchasedItems);
            console.log('Order total:', orderTotal);
            console.log('Order number:', orderNumber);
            
            // Generate dynamic content
            generateTimeline();
            generateRecommendations();
            updateLoyaltyPoints();
        }
        
        function generateTimeline(packedAtStore = 'our store') {
            const container = document.getElementById('timelineContainer');
            const itemCount = purchasedItems.length;
            const itemNames = purchasedItems.map(item => item.name).join(', ');
            const itemSummary = itemCount === 1 ? purchasedItems[0].name : `${itemCount} items (${itemNames})`;
            
            // Determine styling tips based on what was bought
            let stylingTip = 'Pro styling tip: ';
            const hasShirt = purchasedItems.some(item => item.name.toLowerCase().includes('shirt'));
            const hasTie = purchasedItems.some(item => item.name.toLowerCase().includes('tie'));
            const hasTrousers = purchasedItems.some(item => item.name.toLowerCase().includes('trouser'));
            const hasBlazer = purchasedItems.some(item => item.name.toLowerCase().includes('blazer'));
            
            if (hasShirt && hasTie) {
                stylingTip += 'Your shirt and tie combo is perfect! Add matching trousers for a complete look.';
            } else if (hasShirt && hasTrousers) {
                stylingTip += 'Shirt and trousers pair beautifully! Add a tie to elevate your style.';
            } else if (hasShirt) {
                stylingTip += 'Pair your shirt with navy tie and formal trousers for a sophisticated look.';
            } else if (hasTrousers) {
                stylingTip += 'Match your trousers with a crisp shirt and leather belt for a polished look.';
            } else if (hasTie) {
                stylingTip += 'This tie pairs beautifully with light blue or white formal shirts.';
            } else {
                stylingTip += 'Complete your professional wardrobe with matching accessories!';
            }
            
            container.innerHTML = `
                <div class="timeline-item">
                    <div class="timeline-icon completed"><svg class="icon" aria-hidden="true"><use href="icons.svg#check-circle"/></svg></div>
                    <div class="timeline-content">
                        <h3>Order Confirmed</h3>
                        <p>Your order ${orderNumber} has been placed successfully</p>
                        <div class="whatsapp-message">
                            "Hi Rahul! Your order for ${itemSummary} is confirmed. Track it anytime!"
                        </div>
                        <p class="timestamp">2 hours ago • via WhatsApp</p>
                    </div>
                </div>

                <div class="timeline-item">
                    <div class="timeline-icon completed"><svg class="icon" aria-hidden="true"><use href="icons.svg#box"/></svg></div>
                    <div class="timeline-content">
                        <h3>Order Packed</h3>
                        <p>${itemCount} ${itemCount === 1 ? 'item' : 'items'} carefully packed at ${packedAtStore}</p>
                        <div class="whatsapp-message">
                            "Your ${itemCount === 1 ? 'item is' : 'items are'} packed with care. Ready for dispatch!"
                        </div>
                        <p class="timestamp">1 hour ago • via WhatsApp</p>
                    </div>
                </div>

                <div class="timeline-item">
                    <div class="timeline-icon pending"><svg class="icon" aria-hidden="true"><use href="icons.svg#truck"/></svg></div>
                    <div class="timeline-content">
                        <h3>Out for Delivery</h3>
                        <p>Express delivery - arrives tomorrow by 10 AM</p>
                        <div class="whatsapp-message">
                            "On the way! Your ${itemCount === 1 ? 'item' : itemCount + ' items'} will reach you soon. Track in real-time."
                        </div>
                        <p class="timestamp">Scheduled for tomorrow • via WhatsApp</p>
                    </div>
                </div>

                <div class="timeline-item">
                    <div class="timeline-icon"><svg class="icon" aria-hidden="true"><use href="icons.svg#gift"/></svg></div>
                    <div class="timeline-content">
                        <h3>Styling Tips</h3>
                        <p>How to style your ${itemCount === 1 ? 'new purchase' : 'new items'}</p>
                        <div class="whatsapp-message">
                            "${stylingTip} Watch our 2-min styling guide!"
                        </div>
                        <p class="timestamp">After delivery • via WhatsApp</p>
                    </div>
                </div>
            `;
        }
        
        function generateRecommendations() {
            const container = document.getElementById('recommendationsSection');
            
            // Determine recommendations based on what was purchased
            const boughtCategories = purchasedItems.map(item => {
                const name = item.name.toLowerCase();
                if (name.includes('shirt')) return 'shirts';
                if (name.includes('tie')) return 'ties';
                if (name.includes('trouser')) return 'trousers';
                if (name.includes('blazer')) return 'blazers';
                if (name.includes('belt') || name.includes('wallet') || name.includes('cufflink')) return 'accessories';
                if (name.includes('shoe')) return 'shoes';
                return 'other';
            });
            
            // Recommend items from categories they didn't buy
            const recommendations = [];
            
            // Priority recommendations: Black Trousers and Black Blazer for completing the look
            if (!boughtCategories.includes('trousers')) {
                recommendations.push(allProducts.find(p => p.id === 'VH008C')); // Black Formal Trousers
            }
            if (!boughtCategories.includes('blazers')) {
                recommendations.push(allProducts.find(p => p.id === 'VH010')); // Black Blazer
            }
            
            // Fill remaining slots with other recommendations
            if (recommendations.length < 3 && !boughtCategories.includes('shoes')) {
                recommendations.push(allProducts.find(p => p.id === 'VH007')); // Black Formal Shoes
            }
            if (recommendations.length < 3 && !boughtCategories.includes('accessories') && !recommendations.some(r => r && r.category === 'accessories')) {
                recommendations.push(allProducts.find(p => p.id === 'VH012')); // Black Leather Belt
            }
            if (recommendations.length < 3 && !boughtCategories.includes('ties')) {
                recommendations.push(allProducts.find(p => p.id === 'VH002')); // Navy Blue Silk Tie
            }
            
            // If they bought everything, show premium accessories
            if (recommendations.length === 0) {
                recommendations.push(
                    allProducts.find(p => p.id === 'VH008'), // Wallet
                    allProducts.find(p => p.id === 'VH014')  // Cufflinks
                );
            }
            
            // Take top 3 recommendations
            const topRecommendations = recommendations.filter(r => r).slice(0, 3);
            
            let recsHTML = `
                <h3>Complete Your Look</h3>
                <p>
                    Based on your purchase, customers also bought:
                </p>
            `;
            
            topRecommendations.forEach(product => {
                recsHTML += `
                    <div class="product-recommendation">
                        <div class="product-info-rec">
                            <strong>${product.name}</strong>
                            <span>${product.reasoning}</span><br>
                            <span class="price">₹${product.price.toLocaleString()}</span>
                        </div>
                        <button class="add-btn" onclick="addRecommendationToCart('${product.id}')">Add</button>
                    </div>
                `;
            });
            
            recsHTML += `
                <div class="special-offer">
                    Special Offer: Add 2+ items, get 15% off!
                </div>
            `;
            
            container.innerHTML = recsHTML;
        }
        
        function updateLoyaltyPoints() {
            // Calculate loyalty points: 1 point per ₹10 spent
            const pointsEarned = Math.round(orderTotal / 10);
            document.getElementById('pointsEarned').textContent = `${pointsEarned} points earned`;
        }
        
        async function addRecommendationToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product) return;
            
            // Add to cart in localStorage
            let cartItems = JSON.parse(localStorage.getItem('cartItems') || '[]');
            const existing = cartItems.find(item => item.id === product.id);
            
            if (existing) {
                existing.quantity++;
            } else {
                cartItems.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    quantity: 1
                });
            }
            
            localStorage.setItem('cartItems', JSON.stringify(cartItems));
            
            // Call backend API
            try {
                await fetch(`${API_URL}/api/cart/add`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        session_id: sessionId,
                        product_id: product.id,
                        product_name: product.name,
                        price: product.price,
                        quantity: 1
                    })
                });
            } catch (error) {
                console.error('Error adding to cart:', error);
            }
            
            const newTotal = cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const itemCount = cartItems.reduce((sum, item) => sum + item.quantity, 0);
            
            alert(`Added to Cart!\n\n` +
                  `${product.name} has been added.\n\n` +
                  `Total items: ${itemCount}\n` +
                  `Cart total: ₹${newTotal.toLocaleString()}\n` +
                  `${itemCount >= 2 ? 'Special offer active: 15% off on 2+ items!\n\n' : ''}` +
                  'Continue shopping or visit store to checkout?');
        }

        window.onload = () => {
            localStorage.setItem('current_step', '6');
            loadPurchasedItems();
            // The order is packed at the store the customer reserved at
            fetch(`${API_URL}/api/session/${sessionId}`)
                .then(response => response.ok ? response.json() : null)
                .then(session => {
                    if (session && session.reserved_store) generateTimeline(session.reserved_store);
                })
                .catch(error => console.error('Could not load the store:', error));
            console.log('Post-Purchase Follow-up page loaded');
        };
    </script>
</body>
</html>
